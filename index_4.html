<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Obbylox | أوبي لوكس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --paper:#fff8ea; --mint:#63dbb0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:'Tajawal',system-ui,sans-serif; background:#9fe0ff; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .pill { background:var(--paper); border:3px solid var(--ink); border-radius:999px; padding:8px 16px; font:700 16px 'Tajawal'; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--ink); }
  .pill:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  #topleft { position:fixed; top:12px; left:12px; display:flex; gap:8px; direction:ltr; z-index:5; }
  #playerCard { position:fixed; top:12px; right:12px; background:rgba(20,20,28,.85); color:#fff; border-radius:14px; padding:8px 16px; text-align:center; z-index:5; border:2px solid #000; display:none; }
  #playerCard small { display:block; color:var(--mint); font-size:12px; }
  #playerCard b { font-size:20px; }
  #hud { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:none; gap:10px; z-index:5; align-items:center; }
  .hrow { display:none; gap:10px; align-items:center; }
  #hud .stat { background:rgba(20,20,28,.85); color:#fff; border-radius:12px; padding:6px 14px; font-weight:700; border:2px solid #000; white-space:nowrap; }
  .swatchdot { display:inline-block; width:16px; height:16px; border-radius:50%; border:2px solid #fff; vertical-align:middle; }
  #bigMsg { position:fixed; top:22%; left:50%; transform:translateX(-50%); font:900 72px 'Tajawal'; color:#fff; text-shadow:0 4px 0 #000, 0 0 18px rgba(0,0,0,.5); display:none; pointer-events:none; z-index:7; white-space:nowrap; }
  #bottom { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:none; gap:12px; z-index:5; }
  #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:10px 18px; font-weight:700; z-index:9; display:none; max-width:90vw; text-align:center; }
  #creditsCorner { position:fixed; bottom:10px; right:14px; z-index:4; font:700 13px 'Tajawal'; direction:ltr; color:#fff; background:rgba(0,0,0,.4); padding:4px 12px; border-radius:999px; pointer-events:none; }

  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:flex-end; padding:24px 6vw; z-index:10; }
  .card { width:min(440px, 92vw); background:var(--paper); border:4px solid var(--ink); border-radius:26px; padding:22px 24px; box-shadow:10px 10px 0 rgba(0,0,0,.25);
          background-image:repeating-linear-gradient(transparent 0 31px, rgba(60,120,200,.13) 31px 32px); transform:rotate(1.2deg); }
  .card.scroll { max-height:92vh; overflow:auto; transform:none; }
  .card h1 { margin:0; font:900 54px/1 'Tajawal'; letter-spacing:-1px; direction:ltr; text-align:right; text-shadow:3px 3px 0 #63dbb0; }
  .card h2 { margin:4px 0 8px; font:900 38px/1.1 'Tajawal'; color:#9a7cff; text-shadow:2px 2px 0 #63dbb0; }
  .bars { display:flex; gap:8px; margin:8px 0 14px; } .bars i { flex:1; height:6px; border:2px solid var(--ink); border-radius:6px; }
  .card p { font:400 24px 'Tajawal'; margin:4px 0 12px; }
  label { display:block; font-weight:700; font-size:14px; margin:8px 0 6px; }
  input[type=text] { width:100%; padding:12px 16px; font:700 22px 'Tajawal'; border:4px solid var(--ink); border-radius:16px; background:#fff; direction:ltr; text-align:center; outline:none; user-select:text; -webkit-user-select:text; }
  .swatches { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .sw { width:38px; height:38px; border-radius:11px; border:3px solid var(--ink); cursor:pointer; }
  .sw.sel { outline:4px solid rgba(99,219,176,.9); transform:scale(1.12); }
  .big { width:100%; margin-top:16px; padding:14px; font:700 28px 'Tajawal'; background:var(--mint); border:4px solid var(--ink); border-radius:18px; cursor:pointer; box-shadow:0 5px 0 var(--ink); }
  .big:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .credits { margin-top:14px; text-align:center; font:400 15px 'Tajawal'; direction:ltr; color:#333; }
  .credits b { font-weight:900; color:#111; }

  .tabs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .tab { background:#fff; border:3px solid var(--ink); border-radius:999px; padding:4px 12px; font:700 14px 'Tajawal'; cursor:pointer; color:var(--ink); }
  .tab.sel { background:var(--mint); }
  .tab:disabled { opacity:.4; }

  .lbbox { margin:10px 0 0; text-align:center; }
  .lbbox h3 { margin:0 0 6px; font:900 22px 'Tajawal'; }
  .lbrow { display:grid; grid-template-columns:34px 1fr 84px 44px; gap:6px; align-items:center; padding:4px 10px; border-radius:10px; font:700 16px 'Tajawal'; text-align:right; }
  .lbrow:nth-child(even) { background:rgba(0,0,0,.06); }
  .lbrow.me { background:rgba(99,219,176,.55); outline:2px solid var(--ink); }
  .lbrow.head { font-size:13px; opacity:.7; background:none; }
  .lbrow span:nth-child(2) { direction:ltr; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbempty { padding:10px; opacity:.7; font-weight:700; }

  #custom, #result, #lb { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.4); z-index:12; }
  #lb { z-index:13; }

  #joy { position:fixed; left:24px; bottom:24px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.3); display:none; z-index:6; }
  #joy div { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.8); left:35px; top:35px; }
  #jumpBtn { position:fixed; right:28px; bottom:34px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.5); border:3px solid #fff; display:none; z-index:6; font:900 18px 'Tajawal'; align-items:center; justify-content:center; }
  @media (pointer:coarse) { #joy { display:block; } #jumpBtn { display:flex; } #creditsCorner { display:none; } }
  @media (max-width:700px) {
    #start { justify-content:center; align-items:flex-end; }
    .card h1 { font-size:40px; } .card h2 { font-size:28px; }
    #hud .stat { padding:4px 8px; font-size:13px; } #hud { top:56px; }
    .pill { padding:6px 12px; font-size:14px; } #bigMsg { font-size:48px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="topleft">
  <button class="pill" id="muteBtn">🔊 الصوت يعمل</button>
  <button class="pill" id="helpBtn">؟</button>
  <button class="pill" id="lbBtn">🏆</button>
</div>
<div id="playerCard"><small>اللاعب</small><b id="pcName"></b></div>
<div id="hud">
  <div id="hudObby" class="hrow">
    <div class="stat">المرحلة <span id="hStage">0</span>/<span id="hTotal">8</span></div>
    <div class="stat">⏱ <span id="hTime">0.0</span>ث</div>

  </div>

</div>

<div id="start">
  <div class="card">
    <h1>Obbylox</h1>
    <h2>اوصل للنهاية!</h2>
    <div class="bars"><i style="background:#6fd1f0"></i><i style="background:#9a7cff"></i><i style="background:#ff6b6b"></i><i style="background:#ffd93d"></i><i style="background:#63dbb0"></i></div>
    <p>جاهز للتحدي؟</p>
    <label>اسمك في اللعبة</label>
    <input type="text" id="nameIn" maxlength="16" placeholder="Player" autocomplete="off">
    <label>لون شخصيتك</label>
    <div class="swatches" id="startSw"></div>
    <button class="big" id="enterBtn">ادخل اللعبة</button>
    <div class="credits">Credits: <b>Abdulrhman Alsnaidi</b> • <b>abdulrhman</b></div>
  </div>
</div>

<div id="custom"><div class="card scroll">
  <h2 style="font-size:30px">تخصيص الشخصية</h2>
  <label>لون القميص</label><div class="swatches" id="shirtSw"></div>
  <label>لون البنطلون</label><div class="swatches" id="pantsSw"></div>
  <label>لون البشرة</label><div class="swatches" id="skinSw"></div>
  <label>القبعة</label><div class="tabs" id="hatSw"></div>

</div></div>

  <button class="pill" id="homeBtn" style="margin:12px auto 0; display:block">العودة للصالة</button>
  <div class="credits">Credits: <b>Abdulrhman Alsnaidi</b> • <b>abdulrhman</b></div>
</div></div>

<div id="lb"><div class="card scroll">
  <div class="tabs" id="lbGames"></div>
  <div class="tabs" id="lbScopes"></div>

  <button class="big" id="lbClose">إغلاق</button>

</div></div>

<div id="joy"><div id="knob"></div></div>
<div id="jumpBtn">قفز</div>

<script type="module">
import * as THREE from 'three';

// ====================================================================
//  CONFIG - global leaderboard (optional). See README for the setup.
//  Leave both empty to use the local leaderboard only.
// ====================================================================
const CONFIG = { SUPABASE_URL: '', SUPABASE_KEY: '' };

const $ = id => document.getElementById(id);
const COARSE = matchMedia('(pointer:coarse)').matches;
const rand = (a, b) => a + Math.random() * (b - a);

// make sure the Arabic font is ready before drawing sign textures
try {
  await Promise.race([
    Promise.all([document.fonts.load('900 40px Tajawal'), document.fonts.load('700 40px Tajawal')]),
    new Promise(r => setTimeout(r, 2500))
  ]);
} catch (e) {}

// =============== BASIC SETUP ===============
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !COARSE });
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fe0ff);
scene.fog = new THREE.Fog(0x9fe0ff, 90, 300);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 600);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xbfd8ff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.castShadow = true; sun.shadow.mapSize.set(COARSE ? 1024 : 2048, COARSE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// =============== GAME DEFINITIONS ===============
const GAMES = {
  obby:   { name: 'سباق العقبات', asc: true,  fmt: s => s.toFixed(1) + 'ث', icon: '💀',
            title: '🎉 مبروك! وصلت للنهاية', stats: (s, e) => `الوقت: ${s.toFixed(1)} ثانية  •  مرات السقوط: ${e}` },
  colors: { name: 'تحدي الألوان', asc: false, fmt: s => s + ' جولة', icon: '',
            title: 'انتهت اللعبة!', stats: s => `نجوت من ${s} جولة` },
  rush:   { name: 'اندفاع العملات', asc: false, fmt: s => s + ' 🪙', icon: '',
            title: '⏱ انتهى الوقت!', stats: s => `جمعت ${s} عملة` }
};

// =============== WORLD HELPERS ===============
const solids = [], kills = [], movers = [], checkpoints = [], vanishers = [], spinners = [], FLOATERS = [];
function refreshBox(c) {
  const p = c.m.position;
  c.minX = p.x - c.w / 2; c.maxX = p.x + c.w / 2;
  c.minY = p.y - c.h / 2; c.maxY = p.y + c.h / 2;
  c.minZ = p.z - c.d / 2; c.maxZ = p.z + c.d / 2;
}
function addBox(x, y, z, w, h, d, color, o = {}) {
  const mat = o.mat || new THREE.MeshStandardMaterial({ color, roughness: 0.65, flatShading: true });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  if (o.edges) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .35 })); m.add(e); }
  const c = { m, w, h, d, dx: 0, dy: 0, dz: 0, bx: x, by: y, bz: z, ...o };
  refreshBox(c);
  if (o.solid === false) return c;
  (o.kill ? kills : solids).push(c);
  if (o.move) movers.push(c);
  if (o.vanish) { c.vs = 'idle'; c.vt = 0; vanishers.push(c); }
  return c;
}
function decor(x, y, z, w, h, d, color) { return addBox(x, y, z, w, h, d, color, { solid: false }); }
function textTexture(text, bg, fg = '#111', w = 512, h = 160, font = 'bold 76px Tajawal, sans-serif') {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#111'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
  g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 76; while (size > 24 && g.measureText(text).width > w - 40) { size -= 4; g.font = font.replace('76px', size + 'px'); }
  g.fillText(text, w / 2, h / 2 + 4);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function sign(text, bg, x, y, z, w = 5, ry = 0) {
  const dark = () => new THREE.MeshStandardMaterial({ color: 0x222222 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, w * 0.31, 0.2), [dark(), dark(), dark(), dark(), new THREE.MeshBasicMaterial({ map: textTexture(text, bg) }), dark()]);
  m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = true; scene.add(m); return m;
}
function addSpinner(x, y, z, len, speed, phase, game) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.7, 0.7), new THREE.MeshStandardMaterial({ color: 0xe53935, flatShading: true }));
  bar.position.y = 0.35; bar.castShadow = true; g.add(bar);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  post.position.y = 0.45; post.castShadow = true; g.add(post);
  scene.add(g);
  spinners.push({ g, x, y, z, len, speed, phase, game, mul: 1, h: 0.7, thick: 0.7 });
}
const BAR_COLS = [0xb58cf0, 0xff6b5a, 0xf3d35c, 0x8fe3b9, 0x6fd1f0, 0xffa0c0];
function buildFloaters(cx, cy, cz, count, rmin, rmax) {
  count = COARSE ? Math.ceil(count / 2) : count;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, r = rmin + Math.random() * (rmax - rmin);
    const m = new THREE.Mesh(new THREE.BoxGeometry(2 + Math.random() * 8, 0.6 + Math.random(), 1 + Math.random() * 2), new THREE.MeshStandardMaterial({ color: BAR_COLS[i % 6], flatShading: true }));
    m.position.set(cx + Math.cos(a) * r, cy + 4 + Math.random() * 50, cz + Math.sin(a) * r); m.rotation.set(Math.random(), Math.random() * 3, Math.random());
    m.userData = { y: m.position.y, s: Math.random() * 3 }; scene.add(m); FLOATERS.push(m);
  }
}
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
function buildClouds(cx, cz, count, rmin, rmax) {
  count = COARSE ? Math.ceil(count / 2) : count;
  for (let i = 0; i < count; i++) {
    const grp = new THREE.Group();
    for (let k = 0; k < 5; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + Math.random() * 3, 0), cloudMat); s.position.set(k * 4 - 8 + Math.random() * 2, Math.random() * 2, Math.random() * 4); grp.add(s); }
    const a = Math.random() * Math.PI * 2, r = rmin + Math.random() * (rmax - rmin);
    grp.position.set(cx + Math.cos(a) * r, -22 - Math.random() * 25, cz + Math.sin(a) * r); scene.add(grp);
  }
}

// =============== LOBBY ===============
const PORTALS = [], portalInners = [];
function makePortal(x, z, s, ringCol, innerCol, game) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.7 * s, 0.4 * s, 6, 6), new THREE.MeshStandardMaterial({ color: ringCol, roughness: .4, flatShading: true }));
  ring.position.set(x, 3.4 * s, z); ring.rotation.z = Math.PI / 6; ring.castShadow = true; scene.add(ring);
  const inner = new THREE.Mesh(new THREE.CircleGeometry(2.45 * s, 6), new THREE.MeshBasicMaterial({ color: innerCol, transparent: true, opacity: .55, side: THREE.DoubleSide }));
  inner.position.copy(ring.position); inner.rotation.z = Math.PI / 6; scene.add(inner); portalInners.push(inner);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.4 * s, 3.6 * s, 0.3, 6), new THREE.MeshStandardMaterial({ color: ringCol }));
  base.position.set(x, 0.15, z); base.receiveShadow = true; scene.add(base);
  PORTALS.push({ x, z, r: 2.3 * s, game });
}
(function buildHub() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'); g.fillStyle = '#e4dfcf'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#d3cdb8'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(12, 12); tex.colorSpace = THREE.SRGBColorSpace;
  addBox(0, -0.5, 0, 48, 1, 48, 0, { mat: new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }) });

  const lockerCols = [0x1a8ea6, 0x1f9bb5];
  for (const side of [-1, 1]) for (let i = 0; i < 5; i++) {
    const x = side * (6 + i * 2.2);
    addBox(x, 2, -22, 2, 4, 1.8, lockerCols[i % 2], { edges: true });
    decor(x, 3.2, -21.05, 1.2, 0.3, 0.05, 0x0c6073);
  }
  sign('سباق العقبات', '#f3d35c', 0, 7.5, -16, 6);
  sign('تحدي الألوان', '#b58cf0', -12, 5.7, -15.5, 4.6);
  sign('اندفاع العملات', '#8fe3b9', 12, 5.7, -15.5, 4.6);
  sign('Made by Abdulrhman Alsnaidi', '#ffffff', 0, 11.5, -21.5, 9);
  sign('abdulrhman', '#63dbb0', 0, 9.6, -21.5, 5);

  for (const s of [-1, 1]) for (const z of [-8, 6]) {
    addBox(s * 23.9, 2, z, 0.4, 4, 2.4, 0x9a5b2e, { edges: true });
    decor(s * 23.65, 2.4, z, 0.1, 1.2, 0.8, 0xffffff);
  }

  const cc = document.createElement('canvas'); cc.width = cc.height = 256; const cg = cc.getContext('2d');
  cg.fillStyle = '#111'; cg.fillRect(0, 0, 256, 256);
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#b388ff', '#ff80ab'];
  for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { cg.fillStyle = cols[(i * 3 + j * 5 + (i ^ j)) % 6]; cg.fillRect(i * 16 + 3, j * 16 + 3, 10, 10); }
  const ct = new THREE.CanvasTexture(cc); ct.colorSpace = THREE.SRGBColorSpace;
  const carpet = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshStandardMaterial({ map: ct }));
  carpet.rotation.x = -Math.PI / 2; carpet.position.set(-12, 0.02, 4); carpet.receiveShadow = true; scene.add(carpet);
  const mat2 = new THREE.Mesh(new THREE.PlaneGeometry(8, 7), new THREE.MeshStandardMaterial({ color: 0x74d6a4 }));
  mat2.rotation.x = -Math.PI / 2; mat2.position.set(12, 0.02, 4); mat2.receiveShadow = true; scene.add(mat2);

// =============== OBBY COURSE (8 stages) ===============
const OBBY_Z0 = -80;
let TOTAL_STAGES = 0;
(function buildObby() {
  const pal = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4d96ff, 0x9d4edd, 0xff9f1c]; let ci = 0; const col = () => pal[ci++ % pal.length];

  function cp(zc) {

    checkpoints.push({ x: 0, y: y + 0.05, z: zc });
    if (idx > 0) { decor(4.5, y + 2.2, zc - 4.5, 0.2, 4.4, 0.2, 0xffffff); decor(5.4, y + 3.8, zc - 4.5, 1.6, 1, 0.1, 0x00c853); }

    const zc = far - gap - d / 2; y += dy;

  const bad = (x, yy, z, o = {}) => addBox(x, yy, z, 1.2, 1.2, 1.2, 0xe53935, { kill: true, ...o });

  cp(OBBY_Z0);

  // 1 - stepping stones

  nextCp();

  // 2 - moving platforms
  for (let i = 0; i < 6; i++) next(0, 5, 5, 0xffa94d, { move: { ax: 7, ay: 0, az: 0, speed: 1.0 + i * 0.12, phase: i * 1.3 } }, 3.5);
  nextCp(3.5);

  // 3 - beam with kill bricks

  for (const off of [-8, 0, 8]) addBox(0, y + 0.5, beam.m.position.z + off, 1.8, 1, 1.2, 0xe53935, { kill: true });
  next(-3, 3, 3, col(), {}, 3); next(3, 3, 3, col(), {}, 3); next(-3, 3, 3, col(), {}, 3);
  nextCp(3);

  // 4 - the climb
  for (let i = 0; i < 8; i++) {
    const o = {}; if (i === 3 || i === 5) o.move = { ax: 0, ay: 1.8, az: 0, speed: 1.6, phase: i };
    next(i % 2 ? 3 : -3, 3.4, 3.4, col(), o, 2.2, 1.7);
  }
  nextCp(3);

  // 5 - kill-brick gauntlet
  for (let i = 0; i < 7; i++) {
    const c = next(0, 2.6, 2.6, col(), {}, 4.2);
    if (i % 2 === 1) bad(0, y + 0.9, c.m.position.z + 3.4, { move: { ax: 5, ay: 0, az: 0, speed: 2 + i * 0.2, phase: i } });
  }
  nextCp(3);

  // 6 - vanishing tiles
  for (let i = 0; i < 8; i++) next(i % 2 ? 2.4 : -2.4, 3.2, 3.2, col(), { vanish: true }, 2.8);

  nextCp(3);

  // 8 - final mix
  for (let i = 0; i < 10; i++) {
    const k = i % 4;

    else if (k === 1) next(0, 2.6, 2.6, col(), { vanish: true }, 3.2);

    else next(i % 8 < 4 ? -2.5 : 2.5, 2.4, 2.4, col(), { move: { ax: 0, ay: 1.3, az: 0, speed: 1.8, phase: i } }, 3);
  }

  // finish
  const fin = next(0, 14, 14, 0xffd700, { finish: true }, 3);
  const fz = fin.m.position.z;
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.9, 2, 8), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: .6, roughness: .3 }));
  tr.position.set(0, y + 1.2, fz); tr.castShadow = true; scene.add(tr);

  sign('🏁 النهاية 🏁', '#ffd700', 0, y + 6, fz - 7, 8);
  sign('Made by Abdulrhman Alsnaidi', '#ffffff', 0, y + 3.2, fz - 7, 8);

})();

let actx = null, master = null, musicBus = null, sfxBus = null, muted = false;
try { muted = localStorage.getItem('obbylox_muted') === '1'; } catch (e) {}
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = 0.35; musicBus.connect(master);
      sfxBus = actx.createGain(); sfxBus.connect(master);
      setInterval(musicTick, 80);
    }
    master.gain.value = muted ? 0 : 1;
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f, when, dur, type = 'sine', vol = 0.06, bus = sfxBus, f2 = null) {
  if (!actx || !bus) return;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, when);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, when + dur);
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bus); o.start(when); o.stop(when + dur + 0.05);
}
const SFX = {
  jump: t => tone(330, t, .16, 'square', .035, sfxBus, 700),
  land: t => tone(120, t, .09, 'triangle', .09, sfxBus, 60),
  die: t => tone(400, t, .4, 'sawtooth', .06, sfxBus, 70),
  coin: t => { tone(988, t, .08, 'square', .04); tone(1319, t + .07, .14, 'square', .04); },
  cp: t => [523, 659, 784].forEach((f, i) => tone(f, t + i * .08, .18, 'triangle', .07)),
  win: t => [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .12, .3, 'triangle', .09)),
  tick: t => tone(880, t, .07, 'square', .04),
  go: t => tone(520, t, .25, 'square', .05, sfxBus, 1040),
  ui: t => tone(700, t, .08, 'sine', .06)
};
function play(n) { if (actx && !muted && actx.state === 'running') SFX[n](actx.currentTime); }
const ROOTS = [48, 45, 41, 43], PENT = [0, 2, 4, 7, 9]; let mStep = 0, mNext = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick() {
  if (!actx || muted || actx.state !== 'running') return;
  const fast = state.game !== 'lobby', dur = 60 / (fast ? 132 : 92) / 2;
  if (mNext < actx.currentTime) mNext = actx.currentTime + 0.05;
  while (mNext < actx.currentTime + 0.3) {
    const bar = (mStep >> 3) & 3, s = mStep & 7, root = ROOTS[bar];
    if (s === 0 || (fast && s === 4)) tone(mtof(root - 12), mNext, dur * 3.6, 'triangle', 0.22, musicBus);
    const pat = [0, 2, 1, 3, 2, 4, 3, 1][s], note = root + 12 + PENT[pat] + (s % 4 === 3 ? 12 : 0);
    tone(mtof(note), mNext, dur * 0.95, fast ? 'square' : 'triangle', fast ? 0.07 : 0.1, musicBus);
    mNext += dur; mStep++;
  }
}

// =============== LEADERBOARD (local + optional global) ===============
const LB_KEY = 'obbylox_lb_v2';
const GLOBAL_ON = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const lbAll = () => { try { const o = JSON.parse(localStorage.getItem(LB_KEY)); if (o && typeof o === 'object') return o; } catch (e) {} return {}; };
const lbGet = game => { const l = lbAll()[game]; return Array.isArray(l) ? l : []; };
function lbPut(game, list) { try { const o = lbAll(); o[game] = list; localStorage.setItem(LB_KEY, JSON.stringify(o)); } catch (e) {} }
function sortList(game, l) { const a = GAMES[game].asc ? 1 : -1; return l.sort((x, y) => (x.score - y.score) * a || x.extra - y.extra); }
function lbAdd(game, name, score, extra) {
  const e = { name, score: Math.round(score * 100) / 100, extra, ts: Date.now() };
  const l = lbGet(game); l.push(e); sortList(game, l);
  const top = l.slice(0, 10); lbPut(game, top); return top.indexOf(e);
}
const gHeaders = () => ({ apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY });
async function gGet(game) {
  const dir = GAMES[game].asc ? 'asc' : 'desc';
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores?game=eq.${game}&select=name,score,extra&order=score.${dir},extra.asc&limit=100`, { headers: gHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json(), seen = new Set(), out = [];
  for (const e of rows) { if (seen.has(e.name)) continue; seen.add(e.name); out.push({ name: String(e.name), score: +e.score, extra: e.extra || 0 }); if (out.length >= 10) break; }
  return out;
}
async function gPost(game, name, score, extra) {
  await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores`, { method: 'POST', headers: { ...gHeaders(), 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ game, name, score, extra }) });
}
function plausible(game, score) { return game === 'obby' ? score >= 30 : game === 'colors' ? score <= 80 : score <= 150; }

async function renderLb(el, game, scope, hl) {
  const tok = el._tok = (el._tok || 0) + 1;
  const meta = GAMES[game];
  const head = () => { el.textContent = ''; const h = document.createElement('h3'); h.textContent = '🏆 ' + meta.name + (scope === 'global' ? ' (عام)' : ' (محلي)'); el.appendChild(h); };
  const note = t => { const d = document.createElement('div'); d.className = 'lbempty'; d.textContent = t; el.appendChild(d); };
  head();
  let list;
  if (scope === 'global') {
    if (!GLOBAL_ON) { note('الترتيب العام غير مفعّل بعد.'); return; }
    note('جارٍ التحميل...');
    try { list = await gGet(game); } catch (e) { if (tok !== el._tok) return; head(); note('تعذّر تحميل الترتيب العام.'); return; }
    if (tok !== el._tok) return; head();
  } else list = lbGet(game);
  if (!list.length) { note('ما فيه نتائج للحين. العب أول!'); return; }
  const row = (cls, cells) => { const r = document.createElement('div'); r.className = 'lbrow ' + cls; cells.forEach(t => { const s = document.createElement('span'); s.textContent = t; r.appendChild(s); }); el.appendChild(r); };
  row('head', ['#', 'الاسم', 'النتيجة', meta.icon]);
  const hi = hl ? list.findIndex(e => e.name === hl.name && Math.abs(e.score - hl.score) < 0.01) : -1;
  list.forEach((e, i) => row(i === hi ? 'me' : '', [i + 1, e.name, meta.fmt(e.score), meta.icon ? e.extra : '']));
}
const lbView = { game: 'obby', scope: 'local' };
function drawLb() {
  const mkTabs = (el, items, cur, set) => { el.textContent = ''; items.forEach(([k, label]) => { const b = document.createElement('button'); b.className = 'tab' + (cur === k ? ' sel' : ''); b.textContent = label; b.onclick = () => { set(k); drawLb(); }; el.appendChild(b); }); };

  renderLb($('lbList'), lbView.game, lbView.scope);
}
$('lbBtn').onclick = () => { lbView.game = GAMES[state.game] ? state.game : 'obby'; lbView.scope = GLOBAL_ON ? 'global' : 'local'; drawLb(); $('lb').style.display = 'flex'; play('ui'); };
$('lbClose').onclick = () => $('lb').style.display = 'none';
$('lbClear').onclick = () => { if (confirm('تبي تمسح كل النتائج المحلية؟')) { try { localStorage.removeItem(LB_KEY); } catch (e) {} drawLb(); } };

// =============== GAME FLOW ===============
function respawn(countDeath) {
  if (countDeath && state.game === 'obby') { state.deaths++; play('die'); }
  P.x = P.spawn.x; P.y = P.spawn.y; P.z = P.spawn.z; P.vx = P.vy = P.vz = 0; P.ride = null;
}
function setHud(game) {
  $('hud').style.display = game === 'lobby' ? 'none' : 'flex';
  [['Obby', 'obby'], ['Colors', 'colors'], ['Rush', 'rush']].forEach(([n, g]) => $('hud' + n).style.display = g === game ? 'flex' : 'none');
  $('lobbyBtn').style.display = game === 'lobby' ? 'none' : 'inline-block';
}
function startGame(game) {
  lastGame = game; state.game = game; state.over = false; state.started = false; state.time = 0; state.deaths = 0;
  $('result').style.display = 'none'; big(''); setHud(game); cam.yaw = 0; snapCam = true;
  if (game === 'obby') { P.cp = 0; P.spawn = { ...checkpoints[0] }; toast('بالتوفيق! اوصل للنهاية 🏁'); }
  else if (game === 'colors') { P.spawn = { x: COLORS_C.x, y: 0.05, z: 0 }; colorsStart(); toast('قف على اللون المطلوب قبل ما تسقط!'); }
  else { P.spawn = { x: RUSH_C.x, y: 0.05, z: 12 }; rushStart(); toast('اجمع أكبر عدد من العملات وتجنّب العصي الدوّارة!'); }
  respawn(false); play('go');
}
function goLobby() {
  state.game = 'lobby'; state.over = false; $('result').style.display = 'none'; big(''); setHud('lobby');
  P.spawn = { x: 0, y: 0.05, z: -6 }; respawn(false); cam.yaw = Math.PI; snapCam = true;
}
function endGame(game, score, extra) {
  if (state.over) return; state.over = true; big('');
  play(game === 'colors' ? 'die' : 'win');
  const meta = GAMES[game], name = playerName;
  const rank = lbAdd(game, name, score, extra);
  $('resTitle').textContent = meta.title;
  $('resStats').textContent = meta.stats(score, extra) + (rank >= 0 ? `  •  🏆 المركز ${rank + 1}` : '');
  renderLb($('resLb'), game, GLOBAL_ON ? 'global' : 'local', { name, score });
  $('result').style.display = 'flex';
  if (GLOBAL_ON && plausible(game, score)) {
    gPost(game, name, score, extra).then(() => { if ($('result').style.display === 'flex') renderLb($('resLb'), game, 'global', { name, score }); }).catch(() => {});
  }
}

// ---- Colour Panic ----
const CG = { phase: 'ready', t: 0, round: 1, survived: 0, target: 0, last: -1 };
function colorsStart() { CG.round = 1; CG.survived = 0; colorsPrepare(); }
function colorsPrepare() {
  const arr = tiles.map((_, i) => i % 6);
  for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; }
  tiles.forEach((c, i) => { c.ci = arr[i]; c.m.material.color.setHex(COL_HEX[arr[i]]); c.off = false; c.m.visible = true; });
  CG.target = (Math.random() * 6) | 0; CG.phase = 'ready'; CG.t = Math.max(1.3, 3.4 - 0.25 * (CG.round - 1)); CG.last = -1;
  $('cRound').textContent = CG.round; $('cSwatch').style.background = COL_CSS[CG.target]; $('cName').textContent = COL_NAME[CG.target];
}
function updateColors(dt) {
  if (P.y < -3) { endGame('colors', CG.survived, 0); return; }
  CG.t -= dt;
  if (CG.phase === 'ready') {
    const n = Math.max(1, Math.ceil(CG.t));
    big(COL_NAME[CG.target] + ' ' + n, COL_CSS[CG.target]);
    if (n !== CG.last) { CG.last = n; play('tick'); }
    if (CG.t <= 0) {
      tiles.forEach(c => { if (c.ci !== CG.target) { c.off = true; c.m.visible = false; } });
      CG.phase = 'drop'; CG.t = Math.max(1.0, 2.6 - 0.2 * (CG.round - 1)); big('اقفز! 🏃'); play('go');
    }
  } else if (CG.phase === 'drop') {
    if (CG.t <= 0) {
      CG.survived++; CG.phase = 'back'; CG.t = 0.8; big('✔ جولة ' + CG.survived, '#69f0ae'); play('cp');
      tiles.forEach(c => { c.off = false; c.m.visible = true; });
    }
  } else if (CG.phase === 'back') {
    if (CG.t <= 0) { CG.round++; colorsPrepare(); }
  }
}

// ---- Rush ----
const RG = { left: 45, score: 0 };
function placeCoin(m) { m.position.set(RUSH_C.x + rand(-13, 13), 1.3, rand(-13, 13)); }
function rushStart() { RG.left = 45; RG.score = 0; coins.forEach(placeCoin); spinners.forEach(s => { if (s.game === 'rush') s.mul = 1; }); $('rCoins').textContent = 0; $('rTime').textContent = 45; }
function rushHit() { RG.left = Math.max(0, RG.left - 2); respawn(false); play('die'); toast('اصطدمت! -2 ثانية', 1200); }
function updateRush(dt) {
  RG.left -= dt; $('rTime').textContent = Math.max(0, Math.ceil(RG.left)); $('rCoins').textContent = RG.score;
  const mul = 1 + (45 - RG.left) / 60; spinners.forEach(s => { if (s.game === 'rush') s.mul = mul; });
  const now = performance.now() * 0.001;
  coins.forEach((m, i) => {
    m.rotation.y += dt * 3; m.position.y = 1.3 + Math.sin(now * 2 + i) * 0.15;
    if (Math.hypot(P.x - m.position.x, P.z - m.position.z) < 1.3 && Math.abs(P.y + 1 - m.position.y) < 2) { RG.score++; placeCoin(m); play('coin'); }
  });
  if (RG.left <= 0) endGame('rush', RG.score, 0);
}
const updateMini = dt => { if (state.game === 'colors') updateColors(dt); else if (state.game === 'rush') updateRush(dt); };

// =============== PHYSICS ===============
function overlap(c, e = 0) {
  if (c.off) return false;
  return P.x + P.hw > c.minX - e && P.x - P.hw < c.maxX + e && P.y + P.h > c.minY - e && P.y < c.maxY + e && P.z + P.hw > c.minZ - e && P.z - P.hw < c.maxZ + e;
}
function hurt() { if (state.game === 'rush') rushHit(); else respawn(true); }

function stepPhysics(dt) {
  state.t += dt;
  for (const c of movers) {
    const m = c.move, k = Math.sin(state.t * m.speed + m.phase), p = c.m.position;
    const nx = c.bx + k * m.ax, ny = c.by + k * m.ay, nz = c.bz + k * m.az;
    c.dx = nx - p.x; c.dy = ny - p.y; c.dz = nz - p.z; p.set(nx, ny, nz); refreshBox(c);
  }
  for (const v of vanishers) {
    if (v.vs === 'warn') {
      v.vt -= dt; v.m.material.emissive.setHex(Math.sin(state.t * 40) > 0 ? 0x661111 : 0);
      if (v.vt <= 0) { v.off = true; v.m.visible = false; v.vs = 'gone'; v.vt = 2.6; }
    } else if (v.vs === 'gone') {
      v.vt -= dt;
      if (v.vt <= 0) { v.off = false; v.m.visible = true; v.vs = 'idle'; v.m.material.emissive.setHex(0); }
    }
  }
  for (const s of spinners) s.g.rotation.y = state.t * s.speed * s.mul + s.phase;

  if (P.ride && P.ride.move) { P.x += P.ride.dx; P.y += P.ride.dy; P.z += P.ride.dz; }
  P.ride = null;

  let fx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let fz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
  const len = Math.hypot(fx, fz); if (len > 1) { fx /= len; fz /= len; }
  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  const tx = (cy * fx - sy * fz) * 9, tz = (-sy * fx - cy * fz) * 9;
  const k = Math.min(1, (P.ground ? 18 : 8) * dt);
  P.vx += (tx - P.vx) * k; P.vz += (tz - P.vz) * k;
  if (Math.hypot(tx, tz) > 0.5) { const want = Math.atan2(tx, tz); let d = want - P.face; d = Math.atan2(Math.sin(d), Math.cos(d)); P.face += d * Math.min(1, 14 * dt); }

  const wasGround = P.ground, pvy = P.vy;
  if (jumpBuf > 0) jumpBuf -= dt;
  if (jumpBuf > 0 && P.coyote > 0) { P.vy = 12.5; jumpBuf = 0; P.coyote = 0; play('jump'); }
  if (!jumpHeld && P.vy > 5) P.vy -= 40 * dt;
  P.vy = Math.max(P.vy - 32 * dt, -55);

  P.x += P.vx * dt;
  for (const c of solids) if (overlap(c)) { P.x = P.x < (c.minX + c.maxX) / 2 ? c.minX - P.hw - 0.001 : c.maxX + P.hw + 0.001; P.vx = 0; }
  P.z += P.vz * dt;
  for (const c of solids) if (overlap(c)) { P.z = P.z < (c.minZ + c.maxZ) / 2 ? c.minZ - P.hw - 0.001 : c.maxZ + P.hw + 0.001; P.vz = 0; }
  P.y += P.vy * dt; P.ground = false;
  for (const c of solids) if (overlap(c)) {
    if (P.y + P.h / 2 > (c.minY + c.maxY) / 2) { P.y = c.maxY; if (P.vy < 0) P.vy = 0; P.ground = true; P.ride = c; }
    else { P.y = c.minY - P.h; if (P.vy > 0) P.vy = 0; }
  }
  P.coyote = P.ground ? 0.1 : P.coyote - dt;
  if (!wasGround && P.ground && pvy < -9) play('land');
  if (P.ride && P.ride.vanish && P.ride.vs === 'idle') { P.ride.vs = 'warn'; P.ride.vt = 0.7; }

  // spinning bars (only the ones belonging to the current game)
  for (const s of spinners) {
    if (s.game !== state.game || state.over) continue;
    if (P.y + P.h > s.y && P.y < s.y + s.h) {
      const a = s.g.rotation.y, dx = P.x - s.x, dz = P.z - s.z;
      const lx = Math.cos(a) * dx - Math.sin(a) * dz, lz = Math.sin(a) * dx + Math.cos(a) * dz;
      if (Math.abs(lx) < s.len / 2 + P.hw && Math.abs(lz) < s.thick / 2 + P.hw) { hurt(); break; }
    }
  }

  if (state.game === 'obby') {
    if (!state.started && (Math.hypot(P.vx, P.vz) > 1 || P.vy > 1)) state.started = true;
    for (const c of kills) if (overlap(c, 0.05)) { hurt(); break; }
    if (P.ride && P.ride.cp !== undefined && P.ride.cp > P.cp) {
      P.cp = P.ride.cp; P.spawn = { ...checkpoints[P.cp] }; toast(`✔ المرحلة ${P.cp} تمت!`); play('cp');
    }
    if (P.ride && P.ride.finish && !state.over) endGame('obby', state.time, state.deaths);
  } else if (state.game === 'lobby') {
    for (const pt of PORTALS) if (Math.hypot(P.x - pt.x, P.z - pt.z) < pt.r && P.y < 3) { startGame(pt.game); break; }
  }
  if (P.y < P.spawn.y - 30 && state.game !== 'colors') hurt();
}

// =============== INPUT ===============
addEventListener('keydown', e => {
  if (state.mode !== 'play' || e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (!jumpHeld) jumpBuf = 0.12; jumpHeld = true; }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') jumpHeld = false; });
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * 0.006; cam.pitch = Math.min(1.35, Math.max(0.05, cam.pitch + (e.clientY - drag.y) * 0.005)); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { cam.dist = Math.min(24, Math.max(4, cam.dist + e.deltaY * 0.01)); }, { passive: true });
const joyEl = $('joy'), knob = $('knob'); let joyId = null;
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
const endJoy = e => { if (e.pointerId === joyId) { joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
joyEl.addEventListener('pointerup', endJoy); joyEl.addEventListener('pointercancel', endJoy);
function moveJoy(e) { const r = joyEl.getBoundingClientRect(); let x = (e.clientX - r.left - 60) / 50, y = (e.clientY - r.top - 60) / 50; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } joy.x = x; joy.y = y; knob.style.transform = `translate(${x * 35}px,${y * 35}px)`; }
const jb = $('jumpBtn');
jb.addEventListener('pointerdown', e => { e.preventDefault(); jumpHeld = true; jumpBuf = 0.12; });
jb.addEventListener('pointerup', () => jumpHeld = false); jb.addEventListener('pointercancel', () => jumpHeld = false);

// =============== MENUS ===============
function swatches(el, list, getter, setter) {
  el.innerHTML = '';
  list.forEach(c => { const d = document.createElement('div'); d.className = 'sw' + (getter() === c ? ' sel' : ''); d.style.background = c; d.onclick = () => { setter(c); saveProfile(); drawCustom(); }; el.appendChild(d); });
}
function drawHats() {
  const el = $('hatSw'); el.textContent = '';
  HATS.forEach(([id, label]) => { const b = document.createElement('button'); b.className = 'tab' + (look.hat === id ? ' sel' : ''); b.textContent = label; b.onclick = () => { look.hat = id; applyLook(); saveProfile(); drawHats(); }; el.appendChild(b); });
}
const setShirt = c => { look.shirt = c; applyLook(); };
function drawCustom() {
  swatches($('startSw'), COLORS, () => look.shirt, setShirt);
  swatches($('shirtSw'), COLORS, () => look.shirt, setShirt);
  swatches($('pantsSw'), PANTS, () => look.pants, c => { look.pants = c; applyLook(); });
  swatches($('skinSw'), SKINS, () => look.skin, c => { look.skin = c; applyLook(); });
  drawHats();
}
drawCustom();
$('enterBtn').onclick = () => {
  const name = ($('nameIn').value.replace(/[\u0000-\u001f<>]/g, '').trim() || 'Player').slice(0, 16);
  playerName = name; saveProfile(); ensureAudio();
  avatar.add(nameTag(name)); $('pcName').textContent = name;
  $('start').style.display = 'none'; $('playerCard').style.display = 'block'; $('bottom').style.display = 'flex';
  state.mode = 'play'; state.game = 'lobby'; P.spawn = { x: 0, y: 0.05, z: 12 }; respawn(false); cam.yaw = 0; snapCam = true; play('ui');
};
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('enterBtn').click(); });
$('customBtn').onclick = () => { drawCustom(); $('custom').style.display = 'flex'; };
$('customOk').onclick = () => $('custom').style.display = 'none';
$('randBtn').onclick = () => { look.shirt = COLORS[Math.random() * COLORS.length | 0]; look.pants = PANTS[Math.random() * PANTS.length | 0]; look.hat = HATS[Math.random() * HATS.length | 0][0]; applyLook(); saveProfile(); play('ui'); };
$('lobbyBtn').onclick = goLobby; $('homeBtn').onclick = goLobby;
$('againBtn').onclick = () => startGame(lastGame);
setHud('lobby');

// =============== MAIN LOOP ===============
const clock = new THREE.Clock(); const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (state.mode === 'play' && !state.over) {
    for (let i = 0; i < 2 && !state.over; i++) stepPhysics(dt / 2);
    if (state.game === 'obby' && state.started && !state.over) state.time += dt;
    if (!state.over) updateMini(dt);
  }

  avatar.position.set(P.x, P.y, P.z); avatar.rotation.y = P.face;
  const u = avatar.userData, spd = Math.hypot(P.vx, P.vz) / 9, sw = Math.sin(performance.now() * 0.012) * 0.9 * Math.min(1, spd);
  if (P.ground || state.mode !== 'play') { u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw; }
  else { u.legL.rotation.x = 0.4; u.legR.rotation.x = -0.4; u.armL.rotation.x = Math.PI * 0.85; u.armR.rotation.x = Math.PI * 0.85; }
  avatar.visible = state.mode === 'play';

  if (state.mode === 'menu') {
    const a = performance.now() * 0.00008;
    camera.position.set(Math.sin(a) * 6 + 8, 6, 22); camera.lookAt(0, 4, -8);
  } else {
    camTarget.set(P.x, P.y + 1.7, P.z);
    camPos.set(camTarget.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, camTarget.y + Math.sin(cam.pitch) * cam.dist, camTarget.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
    if (camPos.y < 0.5 && state.game !== 'obby') camPos.y = 0.5;
    if (snapCam) { camera.position.copy(camPos); snapCam = false; } else camera.position.lerp(camPos, 1 - Math.pow(0.0005, dt));
    camera.lookAt(camTarget);
  }
  sun.position.set(P.x + 30, P.y + 55, P.z + 22); sun.target.position.set(P.x, P.y, P.z); sun.target.updateMatrixWorld();

  const now = performance.now() * 0.001;
  for (const f of FLOATERS) { f.position.y = f.userData.y + Math.sin(now + f.userData.s) * 0.8; f.rotation.y += dt * 0.1; }
  const po = 0.45 + Math.sin(now * 3) * 0.12; for (const pi of portalInners) pi.material.opacity = po;

  if (state.game === 'obby') { $('hStage').textContent = P.cp; $('hTime').textContent = state.time.toFixed(1); $('hDeaths').textContent = state.deaths; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
